name: CI

on:
  push:
    branches:
      - main
      - 'developer/**'
  pull_request:
    branches:
      - main
      - 'developer/**'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npx vite build --outDir ../.build-ci --emptyOutDir
      # Acessibilidade da administração no navegador, com a API simulada (#31)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, gd
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
      - run: composer audit

  # Fluxo principal no navegador contra o Laravel de verdade (#21, critério 3):
  # SQLite migrado com o seed de demonstração e o build do Vue em public/spa,
  # na mesma origem da API, como em produção.
  fluxo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar o backend com SQLite e o seed
        working-directory: backend
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          # O dotenv fica com o primeiro valor de cada chave: trocar no lugar.
          sed -i             -e "s|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|"             -e "s|^DB_DATABASE=.*|DB_DATABASE=$PWD/database/database.sqlite|"             -e "s|^SESSION_DRIVER=.*|SESSION_DRIVER=file|"             -e "s|^CACHE_STORE=.*|CACHE_STORE=file|"             -e "s|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|"             .env
          php artisan migrate --seed --force
          php artisan storage:link
      - name: Build do front em backend/public/spa
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Instalar o Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Fluxo principal no navegador
        working-directory: frontend
        run: npm run test:fluxo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-fluxo
          path: |
            frontend/test-results/
            backend/storage/logs/
          retention-days: 7
